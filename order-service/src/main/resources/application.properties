spring.application.name=order_service
server.port=${PORT:8082}

api.security.token.secret=${token-secret}

product.service.url=${url-product-service}

spring.datasource.url=${url-database}
spring.datasource.username=${username-database}
spring.datasource.password=${password-database}
aws.sqs.queue.order-created=${sqs-order}
spring.cloud.aws.region.static=us-east-1

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=5

spring.jpa.open-in-view=false
allowed.origins=${ALLOWED_ORIGINS}
management.endpoints.web.exposure.include=health