version: "3.9"

# Sobe com: docker compose up --build
# Para com: docker compose stop

services:

  db-auth:
    image: postgres:16-alpine
    container_name: db-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - db-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-order:
    image: postgres:16-alpine
    container_name: db-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5433:5432"
    volumes:
      - db-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-product:
    image: postgres:16-alpine
    container_name: db-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
    ports:
      - "5434:5432"
    volumes:
      - db-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      TOKEN_SECRET: local-dev-secret
      EMAIL_SES: teste@silvestre.local
      GOOGLE_CLIENT_ID: local-id
      GOOGLE_CLIENT_SECRET: local-secret
      URL_LOGIN: http://localhost:8080/auth/login/google/authorized
      URL_REGISTER: http://localhost:8080/auth/register/google/authorized
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_CONNECT_RETRIES: "5"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      db-auth:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-product:5432/product_db
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_pass
      TOKEN_SECRET: local-dev-secret
      AWS_BUCKET_NAME: silvestre-produtos
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ORDER_QUEUE: order-created
      AWS_REGION: us-east-1
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db-product:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: on-failure

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      SPRING_PROFILES_ACTIVE: local
      url-database: jdbc:postgresql://db-order:5432/order_db
      username-database: order_user
      password-database: order_pass
      token-secret: local-dev-secret
      url-product-service: http://product-service:8081
      sqs-order: order-created
      SPRING_CLOUD_AWS_REGION_STATIC: us-east-1
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      db-order:
        condition: service_healthy
      localstack:
        condition: service_healthy
      product-service:
        condition: service_started
    restart: on-failure

volumes:
  db-auth-data:
  db-order-data:
  db-product-data:
  localstack-data: