name: auth-service CI/CD

# Dispara em push na main OU em pull request para a main
on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "auth-service/**"

# Variáveis globais do pipeline
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: silvestre-auth-service
  ECS_CLUSTER: silvestre-lanchonete
  ECS_SERVICE: auth-service
  CONTAINER_NAME: auth-service

jobs:

  # ============================================================
  # JOB 1 — BUILD E TESTES
  # Roda em todo push e pull request
  # ============================================================
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          # Cache do Maven — acelera builds subsequentes
          cache: maven

      - name: Rodar testes unitários
        working-directory: ./auth-service
        run: ./mvnw test -B

      - name: Publicar relatório de testes
        uses: dorny/test-reporter@v1
        if: always()   # publica mesmo se os testes falharem
        with:
          name: Testes Auth Service
          path: auth-service/target/surefire-reports/*.xml
          reporter: java-junit

  # ============================================================
  # JOB 2 — BUILD DA IMAGEM E DEPLOY
  # Roda APENAS em push na main (não em PRs)
  # Depende do JOB 1 ter passado
  # ============================================================
  build-and-deploy:
    name: Build Imagem e Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Gerar JAR de produção
        working-directory: ./auth-service
        run: ./mvnw package -DskipTests -B

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag e push da imagem no ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Tag com SHA do commit — rastreabilidade total de qual código está em produção
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./auth-service
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Baixar task definition atual do ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.CONTAINER_NAME }} \
            --query taskDefinition \
            > task-definition.json

      - name: Atualizar imagem na task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy no ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Aguarda o serviço estabilizar antes de marcar o deploy como concluído
          wait-for-service-stability: true